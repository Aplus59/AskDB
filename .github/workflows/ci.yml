name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,api]"

      - name: Lint
        run: ruff check .

      - name: Types
        run: mypy src tests scripts

      # No API key and no dataset: every test runs against fixtures and fakes,
      # so a fork can check out this repository and get a green build without
      # credentials. The model-dependent behaviour is tested through the
      # ModelClient protocol rather than through the network.
      - name: Tests
        run: pytest -q
